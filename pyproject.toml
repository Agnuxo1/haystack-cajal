[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haystack-cajal"
version = "2.0.0"
description = "Evidence-aware Haystack components for local CAJAL-style paper workflows"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE" }
dependencies = ["haystack-ai>=2.0,<3"]

[project.optional-dependencies]
local = ["transformers>=4.45", "torch>=2.2"]
test = ["pytest>=8,<9"]

[tool.setuptools]
py-modules = ["haystack_cajal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
